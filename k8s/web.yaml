apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: url-shortener
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
        - name: url-shortener
          image: ${IMAGE}
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017
            - name: APP_ENV
              value: ${APP_ENV}
            - name: BASE_URL
              value: ${BASE_URL}
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
spec:
  type: ClusterIP
  selector:
    app: url-shortener
  ports:
    - port: 80
      targetPort: 3000
